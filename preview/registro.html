<!DOCTYPE html>
<html lang="es">
<head>
  <script type="importmap">
  { "imports": {
    "/js/firebase.js": "/preview/mock-firebase.js",
    "/js/session.js": "/preview/mock-session.js",
    "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js": "/preview/mock-firestore.js",
    "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js": "/preview/mock-auth.js"
  }}
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta · Airtek</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo">AIRTEK</div>
      <div class="sub" id="sub-registro">Crear tu cuenta</div>

      <div id="estado">Validando invitación…</div>

      <form id="form-registro" style="display:none">
        <div class="campo">
          <label for="nombre">Nombre y apellido</label>
          <input type="text" id="nombre" required autocomplete="name" />
        </div>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="campo">
          <label for="password">Contraseña (mínimo 6 caracteres)</label>
          <input type="password" id="password" required autocomplete="new-password" minlength="6" />
        </div>
        <button class="btn" type="submit" style="width:100%">Crear mi cuenta</button>
        <div id="mensaje"></div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/registro.js"></script>
</body>
</html>
