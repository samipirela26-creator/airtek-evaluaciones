<!DOCTYPE html>
<html lang="es">
<head>
  <script type="importmap">
  { "imports": {
    "/js/firebase.js": "/preview/mock-firebase.js",
    "/js/session.js": "/preview/mock-session.js",
    "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js": "/preview/mock-firestore.js",
    "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js": "/preview/mock-auth.js"
  }}
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Requerimiento de Herramientas · GESTO</title>
  <!-- EL NÚMERO ES LA CASCADA. No reordenar estos cuatro <link>. -->
  <link rel="stylesheet" href="/css/1-base.css" />
  <link rel="stylesheet" href="/css/2-layout.css" />
  <link rel="stylesheet" href="/css/3-componentes.css" />
  <link rel="stylesheet" href="/css/4-pantallas.css" />
</head>
<body>
  <div class="topbar">
    <div class="marca">GESTO · Requerimientos</div>
    <div><a class="btn link" href="/preview/panel.html">← Volver</a></div>
  </div>

  <div class="contenedor">
    <div class="card">
      <h1 style="margin-top:0">Requerimiento de Herramientas</h1>
      <p class="meta">
        Consolidado del estado de las herramientas de todos los técnicos de tus
        supervisores. Sirve para sustentar las solicitudes de reposición.
      </p>
      <div id="kpis" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:14px"></div>
      <div class="btn-row" style="margin-top:14px">
        <button class="btn" id="btn-exportar"><svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Exportar a Excel (CSV)</button>
        <button class="btn secundario" id="btn-solo-reponer">Ver solo lo que hay que reponer</button>
      </div>
      <div id="aviso" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Detalle por herramienta</h2>
      <div style="overflow-x:auto">
        <table id="tabla" style="width:100%;border-collapse:collapse;font-size:.88rem">
          <thead>
            <tr style="text-align:left;border-bottom:2px solid var(--borde)">
              <th style="padding:8px 6px">Herramienta / Equipo</th>
              <th style="padding:8px 6px;text-align:center">Total</th>
              <th style="padding:8px 6px;text-align:center;color:#059669">Buenas</th>
              <th style="padding:8px 6px;text-align:center;color:#d97706">Regulares</th>
              <th style="padding:8px 6px;text-align:center;color:#dc2626">Malas</th>
              <th style="padding:8px 6px;text-align:center">Técnicos</th>
            </tr>
          </thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="/js/reporte-herramientas.js"></script>
</body>
</html>
