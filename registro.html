<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta · GESTO</title>
  <!-- La fuente y los dominios de Firebase, pedidos cuanto antes y en paralelo. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" />
  <link rel="modulepreload" href="js/firebase.js" />
  <link rel="modulepreload" href="js/session.js" />
  <!-- EL NÚMERO ES LA CASCADA. No reordenar estos cuatro <link>. -->
  <link rel="stylesheet" href="css/1-base.css" />
  <link rel="stylesheet" href="css/2-layout.css" />
  <link rel="stylesheet" href="css/3-componentes.css" />
  <link rel="stylesheet" href="css/4-pantallas.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo">GESTO</div>
      <div class="sub" id="sub-registro">Crear tu cuenta</div>

      <div id="estado">Validando invitación…</div>

      <form id="form-registro" style="display:none">
        <div class="campo">
          <label for="nombre">Nombre y apellido</label>
          <input type="text" id="nombre" required autocomplete="name" />
        </div>
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="campo">
          <label for="password">Contraseña (mínimo 6 caracteres)</label>
          <input type="password" id="password" required autocomplete="new-password" minlength="6" />
        </div>
        <button class="btn" type="submit" style="width:100%">Crear mi cuenta</button>
        <div id="mensaje"></div>
      </form>
    </div>
  </div>

  <script type="module" src="js/registro.js"></script>
</body>
</html>
