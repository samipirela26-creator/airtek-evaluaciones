<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel · Airtek Evaluaciones</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="panel-body">
  <div class="panel-layout-app">
    <!-- Panel Lateral de Navegación (Visible en PC / Escritorio >= 960px) -->
    <aside class="panel-sidebar" id="panel-sidebar" aria-label="Navegación principal">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <img src="img/airtek-logo-blue-transparent.png" alt="Airtek" class="sidebar-logo" />
          <span class="sidebar-system-tag">SISTEMA OPERATIVO</span>
        </div>
        <div class="sidebar-status-chip">
          <span class="status-pulse"></span>
          <span>Red Airtek Operativa</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Generado dinámicamente según rol desde panel.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user-card">
          <div class="sidebar-user-avatar" id="sidebar-user-avatar">?</div>
          <div class="sidebar-user-info">
            <span class="sidebar-user-name" id="usuario-info-sidebar">Cargando…</span>
            <span class="sidebar-user-role" id="usuario-rol-sidebar">Airtek Fibra</span>
          </div>
          <button class="btn-sidebar-salir" id="btn-salir-sidebar" type="button" title="Cerrar sesión" aria-label="Cerrar sesión">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Área de Trabajo Central -->
    <div class="panel-main-area">
      <!-- Barra superior móvil (Visible en pantallas < 960px) -->
      <header class="topbar mobile-topbar">
        <div class="marca-wrap">
          <img src="img/airtek-logo-blue-transparent.png" alt="Airtek" class="topbar-logo" />
          <span class="topbar-divider"></span>
          <span class="topbar-tag">EVALUACIONES</span>
        </div>
        <div class="topbar-user-area">
          <span class="usuario" id="usuario-info"></span>
          <button class="btn-topbar-salir" id="btn-salir" type="button" title="Cerrar sesión">
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Salir</span>
          </button>
        </div>
      </header>

      <main class="contenedor panel-workspace">
        <!-- Novedades de la última actualización (se muestra una sola vez) -->
        <div class="card bento-span-full" id="novedades" style="display:none;border-left:4px solid var(--azul-airtek)"></div>

        <div class="bento-grid">
          <!-- Acciones según rol (Hero / Featured Card) -->
          <div class="card bento-featured" id="acciones"></div>

          <!-- Módulo central de Bitácora para el supervisor -->
          <div class="card" id="modulo-bitacora" style="display:none"></div>

          <!-- Módulo de Inventario de técnicos para el supervisor -->
          <div class="card" id="modulo-inventario" style="display:none"></div>

          <!-- Lista de evaluaciones / Técnicos / Supervisores -->
          <div class="card">
            <h2 id="titulo-lista">Evaluaciones</h2>
            <div id="lista">Cargando…</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/panel.js"></script>
</body>
</html>
