<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airtek · Evaluaciones</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo">AIRTEK</div>
      <div class="sub">Sistema de Evaluación de Técnicos</div>

      <form id="form-login">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button class="btn" type="submit" style="width:100%">Ingresar</button>
        <div style="text-align:center;margin-top:12px">
          <a href="#" id="link-olvide" style="color:var(--azul);font-size:.9rem">¿Olvidaste tu contraseña?</a>
        </div>
        <div id="mensaje"></div>
      </form>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
