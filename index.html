<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airtek · Evaluaciones</title>
  <meta name="description" content="Sistema de evaluación de técnicos de Airtek. Los supervisores registran y consultan evaluaciones desde cualquier dispositivo." />

  <!-- Open Graph: así se ve el link al compartirlo en WhatsApp, Facebook, Telegram -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Airtek" />
  <meta property="og:title" content="Airtek · Evaluación de Técnicos" />
  <meta property="og:description" content="Sistema de evaluación de técnicos de Airtek. Los supervisores registran y consultan evaluaciones desde cualquier dispositivo." />
  <meta property="og:url" content="https://samipirela26-creator.github.io/airtek-evaluaciones/" />
  <meta property="og:image" content="https://samipirela26-creator.github.io/airtek-evaluaciones/img/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Airtek · Sistema de Evaluación de Técnicos" />
  <meta property="og:locale" content="es_ES" />

  <!-- Twitter/X: usa las og: de arriba, solo necesita saber el formato de tarjeta -->
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-screen-wrap">
    <div class="login-screen">
      <!-- Ondas concéntricas oficiales de señal Airtek en la esquina superior -->
      <img src="img/airtek-waves.svg" alt="" class="fluid-decor" aria-hidden="true" />

      <!-- Barra superior con botón volver -->
      <div class="login-top-bar">
        <button type="button" class="btn-back" aria-label="Volver" onclick="window.history.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </div>

      <!-- Encabezado alineado a la izquierda con marca oficial Airtek -->
      <div class="login-header-left">
        <div class="brand-submark">
          <span class="brand-text">AIRTEK.</span> <span class="brand-accent">Evaluaciones</span>
        </div>
        <h1 class="login-h1">¡Hola de nuevo!</h1>
        <p class="login-desc">Te extrañamos. Ingresa a tu cuenta para continuar.</p>
      </div>

      <!-- Formulario limpio sin etiquetas externas -->
      <form id="form-login" novalidate>
        <div class="input-pill-wrap">
          <svg class="pill-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="email" id="email" required autocomplete="username" placeholder="Correo electrónico" />
        </div>

        <div class="input-pill-wrap">
          <svg class="pill-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" required autocomplete="current-password" placeholder="Contraseña" />
          <button type="button" id="btn-toggle-password" class="pill-eye-btn" aria-label="Mostrar contraseña">
            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>

        <!-- Fila Recordarme / Olvidaste contraseña -->
        <div class="login-actions-row">
          <label class="remember-checkbox">
            <input type="checkbox" id="recordar" />
            <span class="custom-check"></span>
            <span class="remember-label">Recordarme</span>
          </label>
          <a href="#" id="link-olvide" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón negro mate del diseño original -->
        <button class="btn-dark-matte" type="submit">Ingresar</button>

        <!-- Mensajes de estado -->
        <div id="mensaje" role="alert" aria-live="polite"></div>

        <!-- Divisor -->
        <div class="login-divider">
          <span>o continuar con</span>
        </div>

        <!-- Botón de Google -->
        <button type="button" class="btn-google" id="btn-google" title="Continuar con Google">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
          </svg>
          <span>Continuar con Google</span>
        </button>

        <!-- Footer -->
        <div class="signup-footer">
          <span>¿No tienes cuenta?</span>
          <a href="#" class="signup-link">Solicitar acceso</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
