<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airtek · Evaluaciones</title>
  <meta name="description" content="Sistema de evaluación de técnicos de Airtek. Los supervisores registran y consultan evaluaciones desde cualquier dispositivo." />

  <!-- Open Graph: así se ve el link al compartirlo en WhatsApp, Facebook, Telegram -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Airtek" />
  <meta property="og:title" content="Airtek · Evaluación de Técnicos" />
  <meta property="og:description" content="Sistema de evaluación de técnicos de Airtek. Los supervisores registran y consultan evaluaciones desde cualquier dispositivo." />
  <meta property="og:url" content="https://samipirela26-creator.github.io/airtek-evaluaciones/" />
  <meta property="og:image" content="https://samipirela26-creator.github.io/airtek-evaluaciones/img/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Airtek · Sistema de Evaluación de Técnicos" />
  <meta property="og:locale" content="es_ES" />

  <!-- Twitter/X: usa las og: de arriba, solo necesita saber el formato de tarjeta -->
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="logo">AIRTEK</div>
      <div class="sub">Sistema de Evaluación de Técnicos</div>

      <form id="form-login">
        <div class="campo">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button class="btn" type="submit" style="width:100%">Ingresar</button>
        <div style="text-align:center;margin-top:12px">
          <a href="#" id="link-olvide" style="color:var(--azul);font-size:.9rem">¿Olvidaste tu contraseña?</a>
        </div>
        <div id="mensaje"></div>
      </form>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
