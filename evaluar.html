<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluar supervisor · GESTO</title>
  <!-- La fuente y los dominios de Firebase, pedidos cuanto antes y en paralelo. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" />
  <link rel="modulepreload" href="js/firebase.js" />
  <link rel="modulepreload" href="js/session.js" />
  <!-- EL NÚMERO ES LA CASCADA. No reordenar estos cuatro <link>. -->
  <link rel="stylesheet" href="css/1-base.css" />
  <link rel="stylesheet" href="css/2-layout.css" />
  <link rel="stylesheet" href="css/3-componentes.css" />
  <link rel="stylesheet" href="css/4-pantallas.css" />
</head>
<body>
  <div class="topbar">
    <div class="marca">GESTO · Evaluación</div>
  </div>

  <div class="contenedor">
    <div id="estado" class="card">Cargando…</div>

    <form id="form-eval" style="display:none">
      <div class="card">
        <h1 id="titulo">Evaluación</h1>
        <p class="meta" id="subtitulo"></p>
        <div class="campo" style="margin-top:12px">
          <label for="tu-nombre">Tu nombre (opcional)</label>
          <input type="text" id="tu-nombre" placeholder="Puedes dejarlo en blanco" />
        </div>
      </div>

      <div id="secciones"></div>
      <div class="card" id="bloque-sino"></div>

      <div class="card">
        <div id="mensaje"></div>
        <button class="btn" type="submit" id="btn-enviar" style="width:100%">Enviar evaluación</button>
      </div>
    </form>
  </div>

  <script type="module" src="js/evaluar.js"></script>
</body>
</html>
